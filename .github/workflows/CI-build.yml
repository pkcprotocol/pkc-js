# build and release after successful CI
name: CI build

on:
  workflow_run:
    workflows:
      - 'CI'
    types:
      - 'completed'

jobs:
  on-success:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Node 22 bundles npm 10.9.x, which prunes lockfile entries that npm 11 writes
      # and requires (e.g. the version-less placeholder for an unpublished platform
      # optional). release-it's version bump rewrites package-lock.json with this npm,
      # so it must match the npm 11.13.0 pinned in CI-pkc-protocol-test.yml or each
      # release desyncs the lockfile and breaks that job's `npm ci` on master
      # (see the 0.0.91 release commit, which stripped the entry 4f1e9ff79 added).
      - run: npm i -g npm@11.13.0

      - run: npm ci
      - run: npm run build

      - name: Set up Git author
        run: |
          git config --local user.name "pkc-js-release-bot[bot]"
          git config --local user.email "3394437+pkc-js-release-bot[bot]@users.noreply.github.com"

      - name: Get current version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run release -- --ci || true

      - name: Check if released
        id: release
        run: |
          AFTER=$(node -p "require('./package.json').version")
          if [ "${{ steps.before.outputs.version }}" != "$AFTER" ]; then
            echo "Released v$AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "No new version to release"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        # npm 12.0.0 fails `publish --provenance` with MODULE_NOT_FOUND for 'sigstore'
        # (packaging regression: the tarball no longer bundles it where libnpmpublish can
        # resolve it). Pin to npm 11 (trusted publishing needs >= 11.5.1) until npm 12 is fixed.
        run: npx --yes npm@11 publish --access public --provenance

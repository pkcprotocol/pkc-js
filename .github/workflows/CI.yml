# CI for the src folder
name: CI

on:
    pull_request:
        branches:
            - master
        paths:
            - "test/**"
            - "src/**"
            - "rpc/**"
            - "config/**"
            - "package.json"
            - "package-lock.json"
    push:
        branches:
            - master
        paths:
            - "test/**"
            - "src/**"
            - "rpc/**"
            - "config/**"
            - ".github/**"
            - "package.json"
            - "package-lock.json"

jobs:
    test-pkc-js-node-local:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            # Retry: the kubo postinstall downloads its binary from dist.ipfs.tech,
            # which intermittently returns 5xx and aborts the install with no retry
            # of its own.
            - name: npm ci (with retry)
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                    npm ci && exit 0
                    echo "npm ci attempt $attempt failed; retrying in 15s..."
                    sleep 15
                  done
                  exit 1
            - run: npm run build

            - run: DEBUG="pkc*" npm run test:server:node 2>&1 | tee test_server.log & npm run test:server:wait-on
              shell: bash
            - name: Run mocked challenge tests
              id: run_mocked_challenges
              run: node test/run-test-config.js --environment node --per-test-logs ${{ runner.temp }}/per-test-logs test/challenges
            - name: Run node tests (local config)
              id: run_node_tests_local
              # Step timeout below the 35-min job cap: on a Kubo MFS hang this fails the STEP (not the job)
              # while the backgrounded Kubo daemons are still alive, so the goroutine-dump step below can reach them.
              timeout-minutes: 28
              run: DEBUG="pkc*" PKC_CONFIGS=local-kubo-rpc node test/run-test-config.js --parallel --environment node --log-prefix test_node_local --per-test-logs "${{ runner.temp }}/per-test-logs" test/node src/rpc/test/node src/rpc/test/node-and-browser
              shell: bash
            # Capture Kubo daemon goroutine dumps FIRST on failure/cancel, while the daemon is still alive.
            # An MFS deadlock (ipfs/kubo#10842) leaves the daemon responsive but its files/MFS goroutines
            # blocked in go-mfs Lock/Flush — visible here but not in client-side timeout logs.
            - name: Dump Kubo daemon goroutines (node local)
              if: ${{ always() && job.status != 'success' }}
              shell: bash
              run: |
                  mkdir -p kubo-debug
                  for port in 15001 15002 15003 15004 15005 15006; do
                      if curl -sS --max-time 20 "http://127.0.0.1:$port/debug/pprof/goroutine?debug=2" -o "kubo-debug/goroutine-$port.txt"; then
                          echo "saved kubo-debug/goroutine-$port.txt ($(wc -l < kubo-debug/goroutine-$port.txt) lines)"
                      else
                          echo "kubo api port $port not reachable"
                      fi
                  done
                  echo "== MFS/lock-related goroutines across dumps =="
                  grep -nE "boxo/mfs|go-mfs|files\.|Flush|\)\.Lock\(" kubo-debug/goroutine-*.txt 2>/dev/null | head -60 || echo "none found"
            - name: Print failed node tests (local)
              if: ${{ !success() && (steps.run_node_tests_local.outcome == 'failure' || steps.run_node_tests_local.outcome == 'cancelled') }}
              run: node .github/workflows/print-vitest-failures.cjs
            - name: Upload Vitest reports (node local)
              if: ${{ !success() && (steps.run_node_tests_local.outcome == 'failure' || steps.run_node_tests_local.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-node-local-${{ matrix.os }}
                  path: .vitest-reports
                  include-hidden-files: true
                  if-no-files-found: ignore
            - name: Upload per-test logs (node local)
              if: ${{ !success() && (steps.run_node_tests_local.outcome == 'failure' || steps.run_node_tests_local.outcome == 'cancelled' || steps.run_mocked_challenges.outcome == 'failure' || steps.run_mocked_challenges.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: per-test-logs-node-local-${{ matrix.os }}
                  path: ${{ runner.temp }}/per-test-logs
                  if-no-files-found: ignore
            - name: Upload test server log (node local)
              if: ${{ always() && job.status != 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-server-log-node-local-${{ matrix.os }}
                  path: test_server.log
                  if-no-files-found: ignore
            # Kubo daemon's own logs (stdout/stderr + GOLOG debug-level) live inside each repo dir
            # (test/server/test-server.js writes kubo_<node>_{stdout,stderr,golog}_*.log there), plus the
            # goroutine dumps from the step above. These are what reveal the daemon-side MFS hang.
            - name: Upload Kubo daemon logs (node local)
              if: ${{ always() && job.status != 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: kubo-logs-node-local-${{ matrix.os }}
                  path: |
                      .test-ipfs-*/kubo_*.log
                      kubo-debug
                  # .test-ipfs-* are dot-prefixed (hidden); upload-artifact skips hidden paths without this.
                  include-hidden-files: true
                  if-no-files-found: ignore
            - run: cat test_server.log
              if: ${{ always() && job.status != 'success' }}
              shell: bash

    test-pkc-js-node-remote-configs:
        name: test-pkc-js-node-${{ matrix.config }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                config: [remote-kubo-rpc, remote-ipfs-gateway, remote-libp2pjs]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            # Retry: the kubo postinstall downloads its binary from dist.ipfs.tech,
            # which intermittently returns 5xx and aborts the install with no retry
            # of its own.
            - name: npm ci (with retry)
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                    npm ci && exit 0
                    echo "npm ci attempt $attempt failed; retrying in 15s..."
                    sleep 15
                  done
                  exit 1
            - run: npm run build

            - run: DEBUG="pkc*" npm run test:server:node 2>&1 | tee test_server.log & npm run test:server:wait-on
            - name: Run tests with config
              id: run_node_tests_remote
              run: DEBUG="pkc*" node test/run-test-config.js --parallel --pkc-config ${{ matrix.config }} --environment node --log-prefix test_node_${{ matrix.config }} --per-test-logs /tmp/per-test-logs test/node-and-browser src/rpc/test/node-and-browser
            - name: Print failed node tests
              if: ${{ !success() && (steps.run_node_tests_remote.outcome == 'failure' || steps.run_node_tests_remote.outcome == 'cancelled') }}
              run: node .github/workflows/print-vitest-failures.cjs
            - name: Upload Vitest reports (node remote)
              if: ${{ !success() && (steps.run_node_tests_remote.outcome == 'failure' || steps.run_node_tests_remote.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-node-${{ matrix.config }}
                  path: .vitest-reports
                  include-hidden-files: true
                  if-no-files-found: ignore
            - name: Upload test logs
              if: ${{ !success() && (steps.run_node_tests_remote.outcome == 'failure' || steps.run_node_tests_remote.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-${{ matrix.config }}
                  path: |
                      test_node_${{ matrix.config }}.stdout.log
                      test_node_${{ matrix.config }}.stderr.log
                  if-no-files-found: ignore
            - name: Upload per-test logs (node ${{ matrix.config }})
              if: ${{ !success() && (steps.run_node_tests_remote.outcome == 'failure' || steps.run_node_tests_remote.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: per-test-logs-node-${{ matrix.config }}
                  path: /tmp/per-test-logs
                  if-no-files-found: ignore
            - name: Upload test server log (node ${{ matrix.config }})
              if: ${{ always() && job.status != 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-server-log-node-${{ matrix.config }}
                  path: test_server.log
                  if-no-files-found: ignore
            - run: cat test_server.log
              if: ${{ !cancelled() && failure() }}

    test-pkc-js-browser-remote-configs:
        name: test-pkc-js-${{ matrix.environment }}-${{ matrix.config }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                environment: [chrome, firefox]
                config: [remote-kubo-rpc, remote-ipfs-gateway, remote-libp2pjs]
                include:
                    # test/run-test-config.js launches Playwright's chromium for
                    # the "chrome" environment, so that's the browser to install.
                    - environment: chrome
                      playwright-browser: chromium
                    - environment: firefox
                      playwright-browser: firefox
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            # Retry: the kubo postinstall downloads its binary from dist.ipfs.tech,
            # which intermittently returns 5xx and aborts the install with no retry
            # of its own.
            - name: npm ci (with retry)
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                    npm ci && exit 0
                    echo "npm ci attempt $attempt failed; retrying in 15s..."
                    sleep 15
                  done
                  exit 1
            - run: npm run build

            - run: DEBUG="pkc*" npm run test:server:node 2>&1 | tee test_server.log & npm run test:server:wait-on

            # Install only the browser this job runs. A blanket
            # `npx playwright install --with-deps` also pulls webkit's ~180 apt
            # packages, and a slow Azure apt mirror has stalled that download
            # past the 30-minute job timeout (issue #217). The per-attempt
            # `timeout` + retry keeps one stalled mirror from eating the job.
            - name: Install Playwright browsers (with retry)
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                    timeout 300 npx playwright install --with-deps ${{ matrix.playwright-browser }} && exit 0
                    echo "playwright install attempt $attempt failed or stalled; retrying in 15s..."
                    sudo dpkg --configure -a || true
                    sleep 15
                  done
                  exit 1

            # Run tests based on environment and config
            - name: Run browser tests with config
              id: run_browser_tests
              run: DEBUG="pkc*" node test/run-test-config.js --parallel --pkc-config ${{ matrix.config }} --environment ${{ matrix.environment }} --per-test-logs /tmp/per-test-logs test/browser test/node-and-browser

            - name: Print failed browser tests
              if: ${{ !success() && (steps.run_browser_tests.outcome == 'failure' || steps.run_browser_tests.outcome == 'cancelled') }}
              run: node .github/workflows/print-vitest-failures.cjs

            - name: Upload Vitest browser reports
              if: ${{ !success() && (steps.run_browser_tests.outcome == 'failure' || steps.run_browser_tests.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-browser-${{ matrix.environment }}-${{ matrix.config }}
                  path: .vitest-reports
                  include-hidden-files: true
                  if-no-files-found: ignore

            - name: Upload per-test logs (browser ${{ matrix.environment }}-${{ matrix.config }})
              if: ${{ !success() && (steps.run_browser_tests.outcome == 'failure' || steps.run_browser_tests.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: per-test-logs-browser-${{ matrix.environment }}-${{ matrix.config }}
                  path: /tmp/per-test-logs
                  if-no-files-found: ignore

            - name: Upload test server log (browser ${{ matrix.environment }}-${{ matrix.config }})
              if: ${{ always() && job.status != 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-server-log-browser-${{ matrix.environment }}-${{ matrix.config }}
                  path: test_server.log
                  if-no-files-found: ignore

            - run: cat test_server.log
              if: ${{ !cancelled() && failure() }}

    test-pkc-rpc:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            # Setup pkc-js deps
            # Retry: the kubo postinstall downloads its binary from dist.ipfs.tech,
            # which intermittently returns 5xx and aborts the install with no retry
            # of its own.
            - name: npm ci (with retry)
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                    npm ci && exit 0
                    echo "npm ci attempt $attempt failed; retrying in 15s..."
                    sleep 15
                  done
                  exit 1
            - run: npm run build
            # Setup tests for pkc-js using rpc here
            - run: DEBUG="pkc*" npm run test:server:node:rpc 2>&1 | tee test_server.log & npm run test:server:wait-on
            - id: run_rpc_tests
              run: DEBUG="pkc*" USE_RPC=1 PKC_CONFIGS=remote-pkc-rpc node test/run-test-config.js --environment node --parallel --per-test-logs /tmp/per-test-logs test/node test/node-and-browser src/rpc/test/node src/rpc/test/node-and-browser
            - name: Print failed rpc tests
              if: ${{ !success() && (steps.run_rpc_tests.outcome == 'failure' || steps.run_rpc_tests.outcome == 'cancelled') }}
              run: node .github/workflows/print-vitest-failures.cjs
            - name: Upload Vitest reports (rpc)
              if: ${{ !success() && (steps.run_rpc_tests.outcome == 'failure' || steps.run_rpc_tests.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-rpc
                  path: .vitest-reports
                  include-hidden-files: true
                  if-no-files-found: ignore
            - name: Upload per-test logs (rpc)
              if: ${{ !success() && (steps.run_rpc_tests.outcome == 'failure' || steps.run_rpc_tests.outcome == 'cancelled') }}
              uses: actions/upload-artifact@v4
              with:
                  name: per-test-logs-rpc
                  path: /tmp/per-test-logs
                  if-no-files-found: ignore
            - name: Upload test server log (rpc)
              if: ${{ always() && job.status != 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-server-log-rpc
                  path: test_server.log
                  if-no-files-found: ignore
            - run: cat test_server.log
              if: ${{ !cancelled() && failure() }}

            # Setup tests for rpc directory here (skipped for now)

    # test-pkc-react-hooks:
    #     uses: ./.github/workflows/CI-pkc-react-hooks.yml
    #     secrets: inherit

    test-pkc-protocol-test:
        uses: ./.github/workflows/CI-pkc-protocol-test.yml
        secrets: inherit

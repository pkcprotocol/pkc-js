# test plebbit-protocol-test repo which are independent tests
# to make sure the protocol never changes
name: CI pkc-protocol-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # move pkc-js (working dir) to temp folder
      - run: cp -r . ../pkc-js-tmp && rm -fr `ls -A1`
      # clone plebbit-protocol-test repo to working dir
      - run: git clone https://github.com/plebbit/plebbit-protocol-test.git .
      # log the current commit for debugging
      - run: git log -n 1
      # move pkc-js back to working dir in a sub folder
      - run: mv ../pkc-js-tmp pkc-js
      # build the latest pkc-js dist folder
      # Retry: the kubo postinstall downloads its binary from dist.ipfs.tech,
      # which intermittently returns 5xx and aborts the install with no retry
      # of its own. This affects every npm install step below.
      - name: cd pkc-js && npm ci (with retry)
        shell: bash
        run: |
          cd pkc-js
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          exit 1
      - run: cd pkc-js && npm run build
      - run: rm -fr pkc-js/node_modules
      # install plebbit-protocol-test
      - name: npm i (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm i && exit 0
            echo "npm i attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          exit 1
      # install latest pkc-js using add ./pkc-js (local folder module)
      - run: npm remove @pkcprotocol/pkc-js
      - name: npm i ./pkc-js (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm i ./pkc-js && exit 0
            echo "npm i ./pkc-js attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          exit 1
      # Browser binaries come from Playwright's CDN; `--with-deps` additionally
      # runs `apt-get install` from Ubuntu's mirror, and a slow Azure mirror has
      # stalled that past the job timeout before (issue #217). Worse, `timeout`
      # only kills `npx`, so the `apt-get` grandchild survives holding
      # /var/lib/dpkg/lock-frontend and every retry then dies instantly with
      # "Could not get lock". The runner image already ships every shared library
      # Playwright needs (a --with-deps run installs only optional CJK/X11 font
      # packages, which these tests never render), so install the browsers alone
      # and keep apt off the critical path entirely.
      - name: Install Playwright browsers (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30 300 npx playwright install chromium firefox && exit 0
            echo "playwright install attempt $attempt failed or stalled; retrying in 15s..."
            sleep 15
          done
          exit 1
      # disable hosts we shouldn't use
      - run: sudo echo "255.255.255.255 cloudflare-ipfs.com" | sudo tee -a /etc/hosts
      - run: sudo echo "255.255.255.255 pubsubprovider.xyz" | sudo tee -a /etc/hosts
      # test
      - run: DEBUG="pkc-js*,pkc-react-hooks*" TESTING=1 yarn test:server & yarn test:server:wait-on
      - run: DEBUG="pkc-js*,pkc-react-hooks*" npm run test
      - run: DEBUG="pkc-js*,pkc-react-hooks*" npm run test:browser
